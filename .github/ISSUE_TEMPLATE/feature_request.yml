name: Feature request
description: Suggest an idea for Vườn Chung
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem or wish is this about?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
