<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#477a4a" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="description" content="Vườn Chung — a cozy two-player garden you grow together." />
    <title>Vườn Chung</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="game"></div>
    <div id="loading" hidden>
      <div class="loading-card">
        <h1 class="brand">Vườn Chung</h1>
        <div id="loading-bar"><i></i></div>
      </div>
    </div>
    <div id="fatal" class="fatal" role="alert" hidden>
      <p></p>
      <button type="button" class="big"></button>
    </div>
    <div id="ui">
      <header id="status">
        <span id="coins" class="pill"></span>
        <span id="xp" class="pill"></span>
        <span id="clock" class="pill"></span>
        <span id="binval" class="pill muted-pill"></span>
        <button id="rooms-btn" class="pill btn" type="button" hidden>🏡</button>
        <button id="roles-btn" class="pill btn" type="button" hidden></button>
        <button id="invite" class="pill btn invite" type="button" hidden></button>
        <button id="update" class="pill btn invite" type="button" hidden></button>
        <button id="bell" class="pill btn" type="button" hidden></button>
        <button id="mute" class="pill btn" type="button"></button>
        <button id="lang" class="pill btn" type="button" aria-label="Language"></button>
      </header>
      <div id="toast" role="status" aria-live="polite"></div>
      <div id="coach" role="status" aria-live="polite" hidden>
        <small></small>
        <p></p>
        <button type="button"></button>
      </div>
      <footer id="bottom">
        <div id="bag"></div>
        <div id="hotbar"></div>
        <p id="help"></p>
      </footer>
      <div id="stick" aria-hidden="true"><div id="knob"></div></div>
      <button id="act" type="button"></button>
      <div id="emotes" hidden>
        <button type="button" data-e="❤️">❤️</button>
        <button type="button" data-e="👋">👋</button>
        <button type="button" data-e="🌱">🌱</button>
        <button type="button" data-e="😂">😂</button>
      </div>
      <div id="lobby" class="modal lobby" hidden>
        <div class="sheet">
          <h1 class="brand">Vườn Chung</h1>
          <p class="tagline" data-t="tagline"></p>
          <section data-panel="signin">
            <button id="google" class="big" type="button" data-t="sign_in"></button>
            <form id="test-login" hidden>
              <input id="test-name" placeholder="test name" autocomplete="off" />
              <button type="submit">Test login</button>
            </form>
          </section>
          <section data-panel="loading"><p data-t="loading"></p></section>
          <section data-panel="retry"><button id="retry" class="big" type="button" data-t="retry"></button></section>
          <section data-panel="rooms">
            <h2 data-t="rooms_title"></h2>
            <ul id="room-list"></ul>
            <button id="new-room" class="big" type="button" data-t="new_garden"></button>
            <p class="or" data-t="or_join"></p>
            <form id="join">
              <input id="join-code" autocomplete="off" />
              <button type="submit" data-t="join"></button>
            </form>
          </section>
          <section data-panel="create">
            <h2 data-t="new_garden"></h2>
            <input id="room-name" autocomplete="off" maxlength="30" />
            <label class="check"><input id="room-test" type="checkbox" /> <span data-t="test_room"></span></label>
            <p data-t="pick_look"></p>
            <div id="looks">
              <button type="button" class="on" data-look="phu"><canvas width="96" height="96"></canvas></button>
              <button type="button" data-look="su"><canvas width="96" height="96"></canvas></button>
            </div>
            <button id="create" class="big" type="button" data-t="create"></button>
            <button id="back-rooms" class="link" type="button" data-t="back_rooms"></button>
          </section>
          <section data-panel="invite">
            <h2 data-t="invite_title"></h2>
            <p data-t="invite_hint"></p>
            <div class="copyrow">
              <input id="invite-link" readonly />
              <button id="copy" type="button" data-t="copy"></button>
            </div>
            <button id="enter" class="big" type="button" data-t="enter"></button>
          </section>
          <p id="lobby-error" role="alert"></p>
        </div>
      </div>
      <div id="kitchen" class="modal" hidden>
        <div class="sheet">
          <h2 data-t="kitchen_title"></h2>
          <div id="kitchen-list" class="scroll"></div>
          <button id="kitchen-close" class="btn close" type="button" data-t="close"></button>
        </div>
      </div>
      <div id="roles" class="modal" hidden>
        <div class="sheet">
          <h2 data-t="roles_title"></h2>
          <p id="roles-title" class="muted"></p>
          <div id="roles-list"></div>
          <button id="roles-close" class="btn close" type="button" data-t="close"></button>
        </div>
      </div>
      <div id="mail" class="modal" hidden>
        <div class="sheet">
          <h2 data-t="mail_title"></h2>
          <div id="mail-list" class="scroll"></div>
          <form id="mail-form">
            <textarea id="mail-text" rows="3"></textarea>
            <button type="submit" data-t="send"></button>
          </form>
          <button id="mail-close" class="btn close" type="button" data-t="close"></button>
        </div>
      </div>
      <div id="tree" class="modal" hidden>
        <div class="sheet">
          <h2 data-t="tree_title"></h2>
          <p id="tree-count" class="muted"></p>
          <ol id="tree-list" class="scroll"></ol>
          <form id="tree-form">
            <input id="tree-date" type="date" />
            <input id="tree-title" autocomplete="off" />
            <button type="submit" data-t="add_memory"></button>
          </form>
          <button id="tree-close" class="btn close" type="button" data-t="close"></button>
        </div>
      </div>
      <div id="away" class="modal" hidden>
        <div class="sheet">
          <h2 id="away-title"></h2>
          <ul id="away-list"></ul>
          <button id="away-close" class="big" type="button" data-t="ok"></button>
        </div>
      </div>
      <div id="orders" class="modal" hidden>
        <div class="sheet">
          <h2 id="orders-title"></h2>
          <div id="orders-list"></div>
          <button id="orders-close" class="btn" type="button"></button>
        </div>
      </div>
      <div id="shop" class="modal" hidden>
        <div class="sheet">
          <h2 id="shop-title"></h2>
          <div id="shop-list"></div>
          <button id="shop-close" class="btn" type="button"></button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
